<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rune - Modern Code Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark" data-style="modern" data-zen="false">
    <div class="app" id="appRoot">
        <header class="titlebar" id="titlebar">
            <div class="titlebar-drag">
                <div class="brand">
                    <img src="Assets/rune.svg" class="brand-logo" alt="Rune">
                    <span class="brand-name">Rune</span>
                </div>

                <nav class="menubar">
                    <div class="menu-dropdown-container">
                        <button class="menu-button" data-menu="file">File</button>
                        <div class="dropdown-menu hidden" id="fileMenu">
                            <button id="menuNewFile">New File <span class="shortcut">Ctrl+N</span></button>
                            <button id="menuNewFolder">New Folder</button>
                            <div class="dropdown-divider"></div>
                            <button id="menuOpenFile">Open File... <span class="shortcut">Ctrl+O</span></button>
                            <button id="menuOpenFolder">Open Folder...</button>
                            <button id="menuQuickOpen">Quick Open... <span class="shortcut">Ctrl+P</span></button>
                            <div class="dropdown-divider"></div>
                            <button id="menuSave">Save <span class="shortcut">Ctrl+S</span></button>
                            <button id="menuSaveAs">Save As... <span class="shortcut">Ctrl+Shift+S</span></button>
                        </div>
                    </div>
                    <div class="menu-dropdown-container">
                        <button class="menu-button" data-menu="edit">Edit</button>
                        <div class="dropdown-menu hidden" id="editMenu">
                            <button id="menuFind">Find... <span class="shortcut">Ctrl+F</span></button>
                            <button id="menuReplace">Replace... <span class="shortcut">Ctrl+H</span></button>
                            <div class="dropdown-divider"></div>
                            <button id="menuFormat">Format Document</button>
                        </div>
                    </div>
                    <div class="menu-dropdown-container">
                        <button class="menu-button" data-menu="view">View</button>
                        <div class="dropdown-menu hidden" id="viewMenu">
                            <button id="menuToggleSidebar">Toggle Sidebar <span class="shortcut">Ctrl+B</span></button>
                            <button id="menuToggleZen">Zen Mode <span class="shortcut">F11</span></button>
                            <div class="dropdown-divider"></div>
                            <button id="menuCommandPalette">Command Palette <span class="shortcut">Ctrl+Shift+P</span></button>
                        </div>
                    </div>
                    <div class="menu-dropdown-container">
                        <button class="menu-button" data-menu="settingsMenuBtn">Settings</button>
                        <div class="dropdown-menu hidden" id="settingsMenuBtnMenu">
                            <button id="menuPreferences">Preferences... <span class="shortcut">Ctrl+,</span></button>
                        </div>
                    </div>
                </nav>
            </div>

            <div class="titlebar-title" id="workspaceLabel">Rune</div>

            <div class="window-controls">
                <button class="win-btn" id="winMinimize" aria-label="Minimize">
                    <svg viewBox="0 0 12 12" aria-hidden="true">
                        <path d="M2 6h8" />
                    </svg>
                </button>

                <button class="win-btn" id="winMaximize" aria-label="Maximize">
                    <svg viewBox="0 0 12 12" data-icon="maximize" aria-hidden="true">
                        <rect x="2" y="2" width="8" height="8" rx="0.5" />
                    </svg>

                    <svg viewBox="0 0 12 12" data-icon="restore" aria-hidden="true" hidden>
                        <path d="M4 3h6v6" />
                        <path d="M2 5v5h6" />
                    </svg>
                </button>

                <button class="win-btn win-close" id="winClose" aria-label="Close">
                    <svg viewBox="0 0 12 12" aria-hidden="true">
                        <path d="M2 2l8 8M10 2l-8 8" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="main">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span>EXPLORER</span>

                    <div class="sidebar-actions">
                        <button class="icon-btn" id="openFolder" title="Open Folder">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z" />
                                <path d="M2.5 4.5v-1h3.5l1.5 1.5" />
                            </svg>
                        </button>

                        <button class="icon-btn" id="newFile" title="New File">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M8 3v10M3 8h10" />
                            </svg>
                        </button>

                        <button class="icon-btn" id="newFolder" title="New Folder">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M2.5 4.5h3l1.5 1.5h6.5v6.5h-11z" />
                                <path d="M8 7v4M6 9h4" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="sidebar-content">
                    <div class="sidebar-empty" id="sidebarEmpty">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 6.5h7l2 2h9v9.5H3z" />
                                <path d="M3 6.5V5h6l2 2" />
                            </svg>
                        </div>
                        <div class="empty-title">No folder opened</div>
                        <div class="empty-text">Open a folder to start working</div>
                        <button class="empty-button" id="emptyOpenFolder">Open Folder</button>
                    </div>

                    <div class="tree hidden" id="tree"></div>
                </div>
            </aside>

            <section class="workspace">
                <div class="tabs-bar">
                    <div class="tabs" id="tabs"></div>
                    <div class="tabs-actions">
                        <button class="icon-btn" id="zenToggleBtn" title="Toggle Zen Mode">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M2 4h12M2 8h12M2 12h12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="breadcrumbs" id="breadcrumbs">
                    <span class="crumb root-crumb">workspace</span>
                    <span class="crumb-sep">/</span>
                    <span class="crumb current-crumb" id="currentCrumb">No file open</span>
                </div>

                <div class="editor-area">
                    <div class="welcome" id="welcome">
                        <img src="Assets/rune.svg" class="welcome-logo" alt="Rune">
                        <div class="welcome-title">Rune</div>
                        <div class="welcome-subtitle">A modern, lightning-fast code editor for Windows</div>

                        <div class="welcome-sections">
                            <div class="welcome-col">
                                <h3>Start</h3>
                                <button id="welcomeOpenFolder">
                                    <svg viewBox="0 0 16 16"><path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z"/><path d="M2.5 4.5v-1h3.5l1.5 1.5"/></svg>
                                    Open Folder...
                                </button>
                                <button id="welcomeOpenFile">
                                    <svg viewBox="0 0 16 16"><path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3"/></svg>
                                    Open File...
                                </button>
                                <button id="welcomeCommandPalette">
                                    <svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/><path d="M6 6l4 4M10 6l-4 4"/></svg>
                                    Command Palette
                                </button>
                            </div>

                            <div class="welcome-col">
                                <h3>Recent</h3>
                                <div class="recent-list" id="recentList">
                                    <div class="recent-empty">No recent workspaces</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="editor hidden" id="editor">
                        <div class="find-bar hidden" id="findBar">
                            <input type="text" id="findInput" placeholder="Find">
                            <input type="text" id="replaceInput" placeholder="Replace">
                            <button id="findNextBtn" title="Next Match">↓</button>
                            <button id="findPrevBtn" title="Previous Match">↑</button>
                            <button id="replaceBtn" title="Replace">Replace</button>
                            <button id="replaceAllBtn" title="Replace All">All</button>
                            <button id="findCloseBtn" title="Close">×</button>
                        </div>
                        <div class="editor-container">
                            <div class="editor-gutter" id="editorGutter"></div>
                            <div class="editor-view" id="editorView">
                                <div id="editorContent" contenteditable="true" spellcheck="false" placeholder="Start typing or drop files here..."></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="statusbar">
                    <div class="status-left">
                        <span id="statusFile">Rune</span>
                        <span id="statusGit" class="status-item">main*</span>
                    </div>

                    <div class="status-right">
                        <button id="statusSettingsBtn" title="Settings" class="status-btn">⚙ Preferences</button>
                        <span id="statusEncoding" class="status-item">UTF-8</span>
                        <span id="statusLineEnding" class="status-item">LF</span>
                        <span id="statusLanguage" class="status-item">Plain Text</span>
                        <span id="statusPosition" class="status-item">Ln 1, Col 1</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Command Palette (Ctrl+Shift+P) -->
    <div class="modal-overlay hidden" id="commandPaletteModal">
        <div class="modal-box command-box">
            <input type="text" id="commandInput" placeholder="Type a command or search...">
            <div class="command-results" id="commandResults"></div>
        </div>
    </div>

    <!-- Quick Open Modal (Ctrl+P) -->
    <div class="modal-overlay hidden" id="quickOpenModal">
        <div class="modal-box">
            <input type="text" id="quickOpenInput" placeholder="Type a file name to search...">
            <div class="quick-open-results" id="quickOpenResults"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal-box settings-box">
            <div class="modal-header">
                <h2>Preferences</h2>
                <button class="modal-close" id="settingsCloseBtn">×</button>
            </div>
            <div class="modal-body settings-body">
                <div class="settings-nav">
                    <button class="settings-tab-btn active" data-tab="general">General</button>
                    <button class="settings-tab-btn" data-tab="editor">Editor</button>
                    <button class="settings-tab-btn" data-tab="appearance">Appearance</button>
                </div>
                <div class="settings-content">
                    <!-- General Tab -->
                    <div class="settings-pane active" id="paneGeneral">
                        <div class="setting-item">
                            <label>Color Theme</label>
                            <select id="settingTheme">
                                <option value="dark">Dark (Default)</option>
                                <option value="midnight">Midnight Slate</option>
                                <option value="dracula">Dracula Inspired</option>
                                <option value="monokai">Monokai Pro</option>
                                <option value="light">Light Clean</option>
                                <option value="highcontrast">High Contrast</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>UI Style</label>
                            <select id="settingUiStyle">
                                <option value="modern">Modern (Rounded)</option>
                                <option value="classic">Classic (Sharp)</option>
                            </select>
                        </div>
                    </div>
                    <!-- Editor Tab -->
                    <div class="settings-pane" id="paneEditor">
                        <div class="setting-item">
                            <label>Font Family</label>
                            <input type="text" id="settingFontFamily" value="Cascadia Code, JetBrains Mono, Consolas, monospace">
                        </div>
                        <div class="setting-item">
                            <label>Font Size (px)</label>
                            <input type="number" id="settingFontSize" value="13" min="10" max="24">
                        </div>
                        <div class="setting-item">
                            <label>Line Height</label>
                            <input type="text" id="settingLineHeight" value="1.65">
                        </div>
                        <div class="setting-item">
                            <label>Word Wrap</label>
                            <select id="settingWordWrap">
                                <option value="off">Off</option>
                                <option value="on">On</option>
                            </select>
                        </div>
                    </div>
                    <!-- Appearance Tab -->
                    <div class="settings-pane" id="paneAppearance">
                        <div class="setting-item">
                            <label>Accent Color</label>
                            <div class="accent-picker-row">
                                <input type="color" id="settingAccentColor" value="#7c3aed">
                                <input type="text" id="settingAccentText" value="#7c3aed">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settingsSaveBtn" class="primary-btn">Save Settings</button>
            </div>
        </div>
    </div>

    <div class="context-menu hidden" id="contextMenu"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
